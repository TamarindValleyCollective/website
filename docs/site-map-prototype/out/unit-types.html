<title>Unit Type Shapes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a toolbar over a pan/zoom plan with the five standard unit glyphs, a selected-home card and a legend. Tokens follow the member portal's neutral look. */
:root {
  --bg: #f4f5f1; --card: #ffffff; --ink: #1b1e1b; --ink-soft: #596057; --line: rgba(27,30,27,.12);
  --green: #1f7a46; --green-tint: rgba(31,122,70,.12);
  --map: #fbfbf8; --plot: #9aa194; --plot2: #6c7466; --me-tint: rgba(240,178,125,.28); --wall: #1b1e1b;
  --blk: #dfe3d9; --blk-line: #6c7466; --pas: #c4cabc; --up: #eef0e9;
  --sel: #9fd3b2; --me: #f0b27d; --me-line: #a65a24;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151715; --card: #242724; --ink: #f1f3ef; --ink-soft: #a9afa7; --line: rgba(255,255,255,.13);
  --green: #5bc88a; --green-tint: rgba(91,200,138,.16);
  --map: #1b1d1b; --plot: #6f766a; --plot2: #98a092; --me-tint: rgba(240,162,114,.2); --wall: #f1f3ef;
  --blk: #3b413a; --blk-line: #9aa294; --pas: #565d54; --up: #2b2f2a;
  --sel: #2f7a4f; --me: #a8642f; --me-line: #f0a272; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151715; --card: #242724; --ink: #f1f3ef; --ink-soft: #a9afa7; --line: rgba(255,255,255,.13);
  --green: #5bc88a; --green-tint: rgba(91,200,138,.16);
  --map: #1b1d1b; --plot: #6f766a; --plot2: #98a092; --me-tint: rgba(240,162,114,.2); --wall: #f1f3ef;
  --blk: #3b413a; --blk-line: #9aa294; --pas: #565d54; --up: #2b2f2a;
  --sel: #2f7a4f; --me: #a8642f; --me-line: #f0a272; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-size: 2.125rem; line-height: 1.1; font-weight: 700; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.sub { color: var(--ink-soft); margin: 4px 0 0; max-width: 62ch; font-size: .95rem; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: inline-flex; background: var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { font: inherit; font-size: .9rem; font-weight: 600; border: 0; background: transparent; color: var(--ink-soft);
  padding: 7px 14px; border-radius: 8px; cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
label.f { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-soft); }
select, .btn { font: inherit; font-size: .9rem; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; min-height: 36px; }
.btn { cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--green-tint); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.stage { position: relative; background: var(--map); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
#map { display: block; width: 100%; height: min(80vh, 780px); touch-action: none; cursor: grab; }
#map.drag { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; }
.zoom .btn { width: 36px; padding: 0; font-size: 1.1rem; }
.plot { fill: none; stroke: var(--plot); stroke-width: .8; stroke-linejoin: round; opacity: .55; }
.parcel { fill: transparent; stroke: var(--plot2); stroke-width: 1.2; stroke-linejoin: round; cursor: pointer; pointer-events: all; }
.parcel:hover { fill: var(--green-tint); }
.parcel.sel { fill: var(--green-tint); stroke: var(--green); stroke-width: 1.8; }
.parcel.mine { fill: var(--me-tint); }
.wall { fill: none; stroke: var(--wall); stroke-width: 1.3; opacity: .55; }
.blk { fill: var(--blk); stroke: var(--blk-line); stroke-width: 1; }
.pas { fill: var(--pas); stroke: var(--blk-line); stroke-width: .8; }
.up { fill: var(--up); stroke: var(--blk-line); stroke-width: 1; stroke-dasharray: 3 2; }
.rl { font: 600 5px var(--font); fill: var(--ink-soft); text-anchor: middle; dominant-baseline: middle; visibility: hidden; }
.tick { stroke: var(--blk-line); stroke-width: .8; fill: none; }
.house { cursor: pointer; }
.house .hit { fill: transparent; }
.house:hover { --blk: var(--sel); }
.house.sel { --blk: var(--sel); --blk-line: var(--green); }
.house.mine { --blk: var(--me); --blk-line: var(--me-line); }
.house.mine.sel { --blk: var(--me); --blk-line: var(--green); }
.tag { font: 600 7.5px var(--font); fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--map); stroke-width: 2.4px; stroke-linejoin: round; pointer-events: none; }
.tag.mine { fill: var(--me-line); font-size: 9px; }
.cards { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 720px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.card h2 { font-size: 1.125rem; margin: 0 0 8px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: .9rem; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.pill { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--green-tint); color: var(--green); }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; gap: 10px; align-items: center; font-size: .85rem; min-width: 0; }
.legend svg { flex: none; width: 48px; height: 72px; background: var(--map); border: 1px solid var(--line); border-radius: 8px; }
.legend b { display: block; font-size: .9rem; }
.legend span { color: var(--ink-soft); }
.note { color: var(--ink-soft); font-size: .85rem; margin: 0; }
</style>
<style>
.grid{display:grid;gap:14px}
.type{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.type h2{grid-column:1/-1;margin:0;font-size:1.125rem}
.type h2 span{color:var(--ink-soft);font-weight:400;font-size:.9rem;margin-left:8px}
figure{margin:0;min-width:0}
figure svg{display:block;width:100%;height:auto;max-height:420px;background:var(--map);border:1px solid var(--line);border-radius:10px}
figcaption{font-size:.85rem;color:var(--ink-soft);margin-top:6px}
.rl{visibility:visible}
.road{stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:3 3}
.rt{font:600 4px var(--font);fill:var(--ink-soft);text-anchor:middle}
</style>
<main>
<header><h1>Unit type shapes</h1>
<p class="sub">K kitchen, H hall, B bedroom. Solid blocks are ground floor, dashed blocks are first floor, the narrow strip is the passage. The road side is the bottom of each frame, so a separate bedroom sits at the back.</p></header>
<div class="grid" id="g"></div>
</main>
<script>
const TYPES = {
  S:  ['Single bedroom (1 BHK)', 'All on the ground floor: kitchen and hall in a row, with the bedroom below the hall. The base of every other type.'],
  DG: ['Double, ground floor (2 BHK)', 'All on the ground floor: the S unit with a second bedroom behind the kitchen.'],
  DF: ['Double, first floor (2 BHK)', 'The S footprint, with the second bedroom on the first floor above the ground-floor bedroom.'],
  DO: ['Double, two blocks (2 BHK)', 'The S unit with a second ground-floor bedroom in a separate block, joined by a passage.'],
  TO: ['Triple, two blocks (3 BHK)', 'Like DO, with a third bedroom on the first floor above the main block\'s bedroom.']
};
const GLYPHS = {
  S: '<g transform="translate(0 -0.5)"><rect class="blk" x="-17" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-3" width="17" height="22"/><text class="rl" x="-8.5" y="-9">K</text><text class="rl" x="8.5" y="-9">H</text><text class="rl" x="8.5" y="9">B</text></g>',
  DG: '<g transform="translate(0 10.5)"><rect class="blk" x="-17" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-3" width="17" height="22"/><rect class="blk" x="-17" y="-40" width="17" height="22"/><text class="rl" x="-8.5" y="-9">K</text><text class="rl" x="8.5" y="-9">H</text><text class="rl" x="8.5" y="9">B</text><text class="rl" x="-8.5" y="-29">B</text></g>',
  DF: '<g transform="translate(0 -0.5)"><rect class="blk" x="-17" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-3" width="17" height="22"/><rect class="up" x="3" y="0" width="11" height="17"/><text class="rl" x="-8.5" y="-9">K</text><text class="rl" x="8.5" y="-9">H</text><text class="rl" x="8.5" y="9">B</text></g>',
  DO: '<g transform="translate(0 22.5)"><rect class="blk" x="-17" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-3" width="17" height="22"/><rect class="blk" x="-17" y="-64" width="17" height="24"/><rect class="pas" x="-5" y="-40" width="5" height="22"/><text class="rl" x="-8.5" y="-9">K</text><text class="rl" x="8.5" y="-9">H</text><text class="rl" x="8.5" y="9">B</text><text class="rl" x="-8.5" y="-50">B</text></g>',
  TO: '<g transform="translate(0 22.5)"><rect class="blk" x="-17" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-18" width="17" height="15"/><rect class="blk" x="0" y="-3" width="17" height="22"/><rect class="blk" x="-17" y="-64" width="17" height="24"/><rect class="pas" x="-5" y="-40" width="5" height="22"/><rect class="up" x="3" y="0" width="11" height="17"/><text class="rl" x="-8.5" y="-9">K</text><text class="rl" x="8.5" y="-9">H</text><text class="rl" x="8.5" y="9">B</text><text class="rl" x="-8.5" y="-50">B</text></g>'
};
document.getElementById('g').innerHTML = Object.entries(TYPES).map(([k,[n,d]]) => {
  const tall = k=='DO'||k=='TO', top = tall?50:34, h = tall?100:76;
  const f = (flip, cap) => `<figure><svg viewBox="-34 -${top} 68 ${h}" role="img" aria-label="${n}, ${cap}"><g transform="scale(${flip?-1:1} 1)">${GLYPHS[k]}</g><line class="road" x1="-33" x2="33" y1="${h-top-3}" y2="${h-top-3}"/><text class="rt" x="0" y="${h-top+1}">road</text></svg><figcaption>${cap}</figcaption></figure>`;
  return `<section class="type"><h2>${n}<span>${k}</span></h2>${f(false,'As drawn')}${f(true,'Mirrored')}<p class="note" style="grid-column:1/-1;margin:0">${d}</p></section>`;
}).join('');
</script>
