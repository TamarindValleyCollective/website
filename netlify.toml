# Individual partner pages (/ecosystem/partners/<slug> and, briefly,
# /people/partners/<slug>) were removed years ago - each partner's full
# write-up now lives on the single /people/partners listing page instead
# (see content.config.ts for the one deliberate exception: Ananas now has
# a real hand-authored page at /people/partners/ananas, see that file and
# AnanasProjectView.astro). Splat redirects, since there's no matching
# [slug] route to redirect a dynamic Astro `redirects` entry to even if
# that produced a real 301 (see the note below - it doesn't, on this
# static-output project).
#
# Neither rule below is `force`d, so Netlify only applies them when no real
# file exists at the requested path - /people/partners/ananas is served
# directly and isn't swallowed by the second rule's wildcard.
[[redirects]]
  from = "/ecosystem/partners/*"
  to = "/people/partners/"
  status = 301

[[redirects]]
  from = "/people/partners/*"
  to = "/people/partners/"
  status = 301

