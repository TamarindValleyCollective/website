[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# This project's `astro dev` always daemonizes (see CLAUDE.md/AGENTS.md) —
# it's meant to be started separately with `astro dev --background`. Telling
# Netlify Dev not to spawn its own framework command and just proxy to the
# already-running server avoids it mistaking that daemonized exit for a
# crash and tearing the whole `netlify dev` session down.
[dev]
  framework = "#custom"
  targetPort = 4321
  command = "tail -f /dev/null"

# Individual partner pages (/ecosystem/partners/<slug> and, briefly,
# /people/partners/<slug>) were removed years ago - each partner's full
# write-up now lives on the single /people/partners listing page instead
# (see content.config.ts for why there's still no per-partner route).
# Splat redirects, since there's no matching [slug] route to redirect a
# dynamic Astro `redirects` entry to even if that produced a real 301
# (see the note below - it doesn't, on this static-output project).
[[redirects]]
  from = "/ecosystem/partners/*"
  to = "/people/partners"
  status = 301

[[redirects]]
  from = "/people/partners/*"
  to = "/people/partners"
  status = 301

# These used to live in astro.config.mjs's `redirects` map, which - with no
# SSR adapter on this static-output project - doesn't produce a real HTTP
# redirect. It emits a static page with a client-side meta-refresh, a
# `noindex` tag, and a canonical link: a 200-status stub Google can keep
# surfacing in search results (titled "Redirecting to: ...") for a long
# time before it honors that weak signal and drops it from the index -
# exactly the "dead link" symptom this was meant to fix (2026-07-29
# changelog entry). Real 301s here get Google to consolidate onto the new
# URL fast, same as the partner redirects above.

# Ecosystem/Biodiversity were merged, then split back apart with the live
# explorer moved to /ecosystem/biodiversity - this is the pre-Astro URL.
[[redirects]]
  from = "/biodiversity"
  to = "/ecosystem/biodiversity"
  status = 301

# Timeline was its own top-level page, then nested under Our Journey, then
# folded directly into /our-journey itself.
[[redirects]]
  from = "/timeline"
  to = "/our-journey"
  status = 301

[[redirects]]
  from = "/our-journey/timeline"
  to = "/our-journey"
  status = 301

# Community Outreach moved from top-level, to under Our Journey, to under
# People, and was later shortened to "Outreach" - these point straight at
# the final destination rather than chaining through the intermediate
# stops. Splat forms cover individual outreach post slugs.
[[redirects]]
  from = "/community-outreach"
  to = "/people/outreach"
  status = 301

[[redirects]]
  from = "/community-outreach/*"
  to = "/people/outreach/:splat"
  status = 301

[[redirects]]
  from = "/our-journey/community-outreach"
  to = "/people/outreach"
  status = 301

[[redirects]]
  from = "/our-journey/community-outreach/*"
  to = "/people/outreach/:splat"
  status = 301

[[redirects]]
  from = "/people/community-outreach"
  to = "/people/outreach"
  status = 301

[[redirects]]
  from = "/people/community-outreach/*"
  to = "/people/outreach/:splat"
  status = 301

# The Design moved from Our Journey to About TVC.
[[redirects]]
  from = "/our-journey/design"
  to = "/about/design"
  status = 301

# /ecosystem/partners itself (the wildcard form is above, alongside
# /people/partners/*).
[[redirects]]
  from = "/ecosystem/partners"
  to = "/people/partners"
  status = 301

# Leftover URLs from the pre-Astro site, still indexed by Google.
[[redirects]]
  from = "/how-to-reach.html"
  to = "/visit/how-to-reach"
  status = 301

[[redirects]]
  from = "/trekking-trails-of-tvc.html"
  to = "/visit/trekking-trails"
  status = 301

[[redirects]]
  from = "/tvc-3bs-and-1h-dusk-to-dawn-biodiversity-walks-tvc-birdsbutterfliesinsects.html"
  to = "/events/2022-08-27-3bs-and-1h-biodiversity-walk"
  status = 301

[[redirects]]
  from = "/lantana-furniture.html"
  to = "/resource-centre"
  status = 301

[[redirects]]
  from = "/vision-and-objectives.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/resource-center.html"
  to = "/resource-centre"
  status = 301

# syntropic.in (an old member-directory domain) is configured as a domain
# alias on this same Netlify project so DNS/SSL resolve, but it should
# redirect to tvc.farm rather than silently mirror the site under a second
# hostname — a plain domain alias would do the latter without these rules.
[[redirects]]
  from = "https://syntropic.in/*"
  to = "https://tvc.farm/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.syntropic.in/*"
  to = "https://tvc.farm/:splat"
  status = 301
  force = true
