[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# This project's `astro dev` always daemonizes (see CLAUDE.md/AGENTS.md) —
# it's meant to be started separately with `astro dev --background`. Telling
# Netlify Dev not to spawn its own framework command and just proxy to the
# already-running server avoids it mistaking that daemonized exit for a
# crash and tearing the whole `netlify dev` session down.
[dev]
  framework = "#custom"
  targetPort = 4321
  command = "tail -f /dev/null"

# Individual partner pages (/ecosystem/partners/<slug> and, briefly,
# /people/partners/<slug>) were removed - each partner is folded into a
# single section on /people instead (see astro.config.mjs for why).
# Wildcard redirects here rather than in astro.config.mjs's `redirects`,
# since Astro requires a dynamic source there to redirect to a route with
# a matching [slug] param, and no such route exists anymore.
[[redirects]]
  from = "/ecosystem/partners/*"
  to = "/people#partners"
  status = 301

[[redirects]]
  from = "/people/partners/*"
  to = "/people#partners"
  status = 301
