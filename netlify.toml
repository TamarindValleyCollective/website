[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Baseline security headers. No Content-Security-Policy yet - the site embeds
# accounts.google.com (Sign-In), www.google.com (Maps), and www.youtube.com,
# and a CSP tight enough to matter needs to be worked out and verified live
# against all three before shipping, not guessed here.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=()"

# This project's `astro dev` always daemonizes (see CLAUDE.md/AGENTS.md) —
# it's meant to be started separately with `astro dev --background`. Telling
# Netlify Dev not to spawn its own framework command and just proxy to the
# already-running server avoids it mistaking that daemonized exit for a
# crash and tearing the whole `netlify dev` session down.
[dev]
  framework = "#custom"
  targetPort = 4321
  command = "tail -f /dev/null"

# members.tvc.farm is the member portal. It is a domain alias on this same Netlify project
# (DNS: a proxied CNAME in Cloudflare), so without these rules it would mirror the whole public
# site, and the staff pages, under a second hostname. They only match that host. Netlify takes
# the first rule that matches, so: the root shows the portal; the paths the portal needs are each
# listed (a rewrite to itself) so the catch-all below never sees them; staff pages go to the main
# host; and anything else is sent back to the portal's home. See DOMAINS.md.
[[redirects]]
  from = "https://members.tvc.farm/"
  to = "/members/"
  status = 200
  force = true

# the portal page itself
[[redirects]]
  from = "https://members.tvc.farm/members/*"
  to = "/members/:splat"
  status = 200
  force = true

# its bundled scripts and styles
[[redirects]]
  from = "https://members.tvc.farm/_astro/*"
  to = "/_astro/:splat"
  status = 200
  force = true

# fonts
