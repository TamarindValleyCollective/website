name: Finance tests

# Unit tests for the finance module's access rules (expiry, capability matrix, masking, maker-is-not-checker), the
# parties/payee rules and import planner, the payee encryption, and end-to-end checks of the finance-admin Function
# through requireStaff with Google and Supabase stubbed.
# Needs no secrets. The endpoint test bundles the function with esbuild (installed by npm ci) and imports the
# registry's .ts directly, which needs Node 22.18 or newer.

on:
  pull_request:
    paths:
      - 'netlify/functions/**'
      - 'package.json'
      - 'scripts/lib/finance-*'
      - 'scripts/import-fin-parties.mjs'
      - 'docs/finance/**'
      - '.github/workflows/finance-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Finance rules, parties, importers and endpoints
        run: node --test scripts/lib/finance-*.test.mjs
