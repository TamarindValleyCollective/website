name: Member profile update email

# Notifies members@tvc.farm (plus the individual member(s) whose card
# changed, CC'd) whenever a push to main touches src/data/members.ts - the
# automated half of the "process member profile updates" workflow; see
# scripts/check-member-story-responses.mjs for the human-run half and
# scripts/send-member-update-email.mjs for what this actually sends.
#
# Needs RESEND_API_KEY (resend.com dashboard) and the existing
# GDRIVE_SERVICE_ACCOUNT_EMAIL/_PRIVATE_KEY (same tvc-photo-pool service
# account used by the local scripts and Netlify functions, added as repo
# secrets here 2026-08-19 so this workflow can look up each changed
# member's own email from the response Sheet) as repo secrets.

on:
  push:
    branches: [main]
    paths:
      - 'src/data/members.ts'
  workflow_dispatch:
    inputs:
      compare_ref:
        description: 'Git ref to diff members.ts against (defaults to the previous commit)'
        required: false
      test_recipient:
        description: 'If set, sends the real email to just this address instead of members@tvc.farm + CCs (for testing)'
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just the pushed commit's immediate parent: a
          # manually-dispatched compare_ref can point arbitrarily far back,
          # and a too-shallow checkout made send-member-update-email.mjs
          # silently treat every current member as "new" instead of erroring
          # (caught in the first live test run, 2026-08-19) - cheap for a
          # repo this size, so just always fetch everything.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send update email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_EMAIL }}
          GDRIVE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GITHUB_EVENT_BEFORE: ${{ github.event.inputs.compare_ref || github.event.before }}
          TEST_SEND_TO: ${{ github.event.inputs.test_recipient }}
        run: node scripts/send-member-update-email.mjs
