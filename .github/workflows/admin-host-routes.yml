name: Admin host routes

# Fails a PR that adds an admin page (src/pages/internal/*) or an admin function (one that checks a
# signed-in admin) without listing it for admin.tvc.farm in netlify.toml. That host sends anything
# unlisted to the admin home, so a missed rule works on previews and in `netlify dev` and then
# silently lands on "Today" in production (the Units screen shipped that way once). See DOMAINS.md
# and scripts/lib/admin-host-routes.test.mjs. Needs no secrets.

on:
  pull_request:
    paths:
      - 'netlify.toml'
      - 'src/pages/internal/**'
      - 'netlify/functions/**'
      - 'scripts/lib/admin-host-routes.test.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Every admin page and function is listed for admin.tvc.farm
        run: node --test scripts/lib/admin-host-routes.test.mjs
